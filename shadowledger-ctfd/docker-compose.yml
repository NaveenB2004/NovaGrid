services:
  ctfd:
    image: ctfd/ctfd:3.8.6
    container_name: shadowledger-ctfd
    restart: always
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:${MYSQL_PASSWORD}@db/ctfd
      - REDIS_URL=redis://cache:6379
      - SECRET_KEY=${CTFD_SECRET_KEY}
      - WORKERS=2
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - ./CTFd-data/logs:/var/log/CTFd
      - ./CTFd-data/uploads:/var/uploads
    depends_on:
      - db
      - cache
    networks:
      - internal
    # No published ports here on purpose — only nginx is reachable from CTF-LAN.
    # This keeps the app server itself unreachable except through the TLS front end,
    # matching the "least-surprise" control in the report's security-controls list.

  nginx:
    image: nginx:stable
    container_name: shadowledger-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # Published on the VM's own interface. Isolation is enforced one layer down,
    # at the VirtualBox host-only adapter this VM's NIC is bound to (SETUP.md
    # step 2) — that's what actually keeps CTF-LAN off the institutional
    # network, not anything Docker does.
    ports:
      - "443:443"
    depends_on:
      - ctfd
    networks:
      - internal

  db:
    image: mariadb:10.11
    container_name: shadowledger-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./CTFd-data/db:/var/lib/mysql
    networks:
      - internal
    command: [
      "mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--wait_timeout=28800",
      "--log-warnings=0"
    ]

  cache:
    image: redis:7-alpine
    container_name: shadowledger-cache
    restart: always
    volumes:
      - ./CTFd-data/redis:/data
    networks:
      - internal

networks:
  # Fully internal — CTFd/db/redis never touch anything but each other and nginx.
  # nginx is the only container with a published port, so it's the only
  # thing reachable from CTF-LAN.
  internal:
    internal: true
